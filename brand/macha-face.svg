<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Macha face logo</title>
  <desc id="desc">Macha's original warm-white rounded face with two dark eyes.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFB"/>
      <stop offset="1" stop-color="#E9E2DC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="112" y="197" width="800" height="630" rx="255" fill="url(#face)" filter="url(#shadow)"/>
  <circle cx="373" cy="535" r="42" fill="#231F20"/>
  <circle cx="651" cy="535" r="42" fill="#231F20"/>
</svg>
