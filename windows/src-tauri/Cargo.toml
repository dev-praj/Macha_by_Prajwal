[package]
name = "macha"
description = "Macha for Windows — a desktop assistant at the top of your screen"
authors = ["Prajwal"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "macha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
cpal = "0.18"
url = "2"
tauri-plugin-dialog = "2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
mdns-sd = { version = "0.21", default-features = false }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-future = "0.2.1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_RemoteDesktop",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "ApplicationModel",
  "Data_Xml_Dom",
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Media_Audio",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_System_WinRT",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
